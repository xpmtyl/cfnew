name: Deploy cfnew to Cloudflare Pages (直传)

# 直传部署：绕开 Pages 的 Git 集成。
# 背景：2026-09-30 起 Pages 项目 cfnew 的 Git 授权已失效（push 不再触发构建，
# API 报 8000032 Unable to find a branch），所以改由本工作流把最新 _worker.js
# 直接上传到 Pages 项目 cfnew，实现「同步更新 → 自动部署」闭环。

on:
  push:
    branches: [main]
    paths:
      - "_worker.js"
      - "VERSION.txt"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: 直传部署到 Cloudflare Pages
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 准备上传目录
        run: |
          mkdir -p .pages-upload
          cp _worker.js .pages-upload/_worker.js
          [ -f README.md ] && cp README.md .pages-upload/ || true
          [ -f VERSION.txt ] && cp VERSION.txt .pages-upload/ || true
          echo "将上传："
          ls -la .pages-upload

      - name: 部署到 Pages 项目 cfnew
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: pages deploy .pages-upload --project-name=cfnew --branch=main --commit-dirty=true
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: 输出摘要
        if: always()
        run: |
          echo "## cfnew 直传部署" >> $GITHUB_STEP_SUMMARY
          echo "- 触发提交: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- 版本文件: $(cat VERSION.txt 2>/dev/null || echo '(无)')" >> $GITHUB_STEP_SUMMARY
          echo "- 结果: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
